<!doctype html><html><head><meta charset="utf-8"><title>Cubism capture loading</title><style>html,body{margin:0;width:var(--canvas-width,1024px);height:var(--canvas-height,1024px);overflow:hidden;background:transparent}canvas{display:block;width:var(--canvas-width,1024px);height:var(--canvas-height,1024px)}#error{position:absolute;top:0;color:red;background:white}</style></head><body><canvas id="capture" width="1024" height="1024"></canvas><div id="error"></div><script>const query=new URLSearchParams(location.search);const positive=(value,fallback)=>{const number=Number(value);return Number.isFinite(number)&&number>0?Math.floor(number):fallback};const width=positive(query.get('canvasWidth')||query.get('width'),1024);const height=positive(query.get('canvasHeight')||query.get('height'),1024);document.documentElement.style.setProperty('--canvas-width',`${width}px`);document.documentElement.style.setProperty('--canvas-height',`${height}px`);const canvas=document.getElementById('capture');canvas.width=width;canvas.height=height;</script><script src="/live2d/Core/live2dcubismcore.min.js"></script><script type="module" src="/capture.js"></script></body></html>
